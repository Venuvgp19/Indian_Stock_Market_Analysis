<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Stock Market Analyzer 🇮🇳</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #f093fb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Professional Header */
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .header .tagline {
            margin-top: 10px;
            font-size: 0.9em;
            opacity: 0.8;
            font-style: italic;
        }
        
        /* Unified Navigation */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-bar a {
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            background: rgba(255,255,255,0.15);
            border-radius: 30px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .nav-bar a:hover {
            background: white;
            color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .nav-bar a.active {
            background: white;
            color: var(--primary-dark);
            font-weight: 600;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2, .card h3 {
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card h2 i, .card h3 i {
            color: var(--primary);
        }
        
        /* Summary Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            text-align: center;
            transition: all 0.3s;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .summary-card .icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .summary-card .label {
            color: var(--gray);
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .summary-card .value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--dark);
        }
        
        .summary-card.green .icon { color: var(--success); }
        .summary-card.green .value { color: var(--success); }
        .summary-card.red .icon { color: var(--danger); }
        .summary-card.red .value { color: var(--danger); }
        .summary-card.blue .icon { color: var(--primary); }
        .summary-card.blue .value { color: var(--primary); }
        .summary-card.purple .icon { color: var(--primary-dark); }
        .summary-card.purple .value { color: var(--primary-dark); }
        
        /* Search Box */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* Buttons */
        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }
        
        /* Stock Cards */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stock-card {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .stock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .btn-comprehensive {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-comprehensive:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .stock-symbol {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--dark);
        }
        
        .stock-name {
            font-size: 0.9em;
            color: var(--gray);
        }
        
        .score-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }
        
        .score-high { background: linear-gradient(135deg, var(--success), #059669); }
        .score-medium { background: linear-gradient(135deg, var(--warning), #d97706); }
        .score-low { background: linear-gradient(135deg, var(--danger), #dc2626); }
        
        .stock-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .detail-label {
            font-weight: 600;
            color: var(--gray);
        }
        
        .detail-value {
            color: var(--dark);
        }
        
        .recommendation {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        .rec-strong-buy { background: #d1fae5; color: #065f46; }
        .rec-buy { background: #dcfce7; color: #166534; }
        .rec-hold { background: #fef3c7; color: #92400e; }
        .rec-sell { background: #fee2e2; color: #991b1b; }
        .rec-strong-sell { background: #fecaca; color: #7f1d1d; }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: var(--gray);
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Error */
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        
        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--gray);
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        td {
            font-size: 0.95em;
        }
        
        /* Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .badge-green {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-red {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .badge-neutral {
            background: #e2e8f0;
            color: #475569;
        }
        
        .badge-blue {
            background: #dbeafe;
            color: #1e40af;
        }
        
        /* Form */
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        input, select {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5em; }
            .nav-bar a { padding: 10px 15px; font-size: 0.9em; }
            .summary-grid { grid-template-columns: 1fr; }
            .stock-grid { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
        }
        
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(10px); 
            padding: 12px 20px; 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            flex-wrap: wrap; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1); 
            z-index: 1000; 
        }
        .bottom-nav a { 
            color: var(--primary-dark); 
            text-decoration: none; 
            padding: 8px 16px; 
            background: #f1f5f9; 
            border-radius: 20px; 
            transition: all 0.3s; 
            font-size: 0.85em; 
            font-weight: 500; 
            border: 1px solid #e2e8f0; 
        }
        .bottom-nav a:hover { background: var(--primary); color: white; }
        .bottom-nav a.active { background: var(--primary); color: white; }
        body { padding-bottom: 80px; }
        
        .search-results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-full-analysis {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-full-analysis:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Professional Header -->
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Indian Stock Market Analyzer</h1>
            <p>AI-Powered Stock Research & Portfolio Tracking</p>
            <div class="tagline">🇮🇳 NSE & BSE Market Intelligence Platform</div>
        </div>
        
        <!-- Unified Navigation -->
        <div class="nav-bar">
            <a href="/" class="active"><i class="fas fa-home"></i> Home</a>
            <a href="/research"><i class="fas fa-search"></i> Research</a>
            <a href="/backtest"><i class="fas fa-chart-bar"></i> Backtest</a>
            <a href="/portfolio"><i class="fas fa-chart-pie"></i> Portfolio</a>
            <a href="/market-overview"><i class="fas fa-globe"></i> Market</a>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading market data...</p>
        </div>

        <!-- Content -->
        <div id="content" style="display: none;">
            <!-- Market Overview Cards -->
            <div class="summary-grid" id="market-overview">
                <!-- Dynamic content -->
            </div>

            <!-- Search Section -->
            <div class="card">
                <h2><i class="fas fa-search"></i> Search Stocks</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Enter stock symbol (e.g., RELIANCE.NS)">
                    <button class="btn" onclick="searchStock()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>

            <!-- Top Stocks Section -->
            <div class="card">
                <h2>
                    <i class="fas fa-trophy"></i> Top 10 Stock Recommendations
                    <button class="btn btn-success" onclick="refreshAnalysis()" style="float: right;">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </h2>
                <div id="top-stocks-grid" class="stock-grid">
                    <!-- Dynamic content -->
                </div>
            </div>

            <!-- Search Results -->
            <div class="card" id="search-results" style="display: none;">
                <h2><i class="fas fa-chart-bar"></i> Analysis Results</h2>
                <div id="analysis-result">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        // Fetch market overview
        async function fetchMarketOverview() {
            try {
                const response = await fetch('/api/market-overview');
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                
                const overview = document.getElementById('market-overview');
                overview.innerHTML = `
                    <div class="summary-card blue">
                        <div class="icon">📈</div>
                        <div class="label">NIFTY 50</div>
                        <div class="value">${data.NIFTY_50?.value?.toFixed(2) || 'N/A'}</div>
                        <div style="font-size: 0.9em; margin-top: 5px;">
                            <span style="color: ${data.NIFTY_50?.change >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                ${data.NIFTY_50?.change >= 0 ? '+' : ''}${data.NIFTY_50?.change?.toFixed(2) || 0}%
                            </span>
                        </div>
                    </div>
                    <div class="summary-card purple">
                        <div class="icon">📊</div>
                        <div class="label">SENSEX</div>
                        <div class="value">${data.SENSEX?.value?.toFixed(2) || 'N/A'}</div>
                        <div style="font-size: 0.9em; margin-top: 5px;">
                            <span style="color: ${data.SENSEX?.change >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                ${data.SENSEX?.change >= 0 ? '+' : ''}${data.SENSEX?.change?.toFixed(2) || 0}%
                            </span>
                        </div>
                    </div>
                    <div class="summary-card green">
                        <div class="icon">🏦</div>
                        <div class="label">NIFTY BANK</div>
                        <div class="value">${data.NIFTY_BANK?.value?.toFixed(2) || 'N/A'}</div>
                        <div style="font-size: 0.9em; margin-top: 5px;">
                            <span style="color: ${data.NIFTY_BANK?.change >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                ${data.NIFTY_BANK?.change >= 0 ? '+' : ''}${data.NIFTY_BANK?.change?.toFixed(2) || 0}%
                            </span>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="icon">💻</div>
                        <div class="label">NIFTY IT</div>
                        <div class="value">${data.NIFTY_IT?.value?.toFixed(2) || 'N/A'}</div>
                        <div style="font-size: 0.9em; margin-top: 5px;">
                            <span style="color: ${data.NIFTY_IT?.change >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                ${data.NIFTY_IT?.change >= 0 ? '+' : ''}${data.NIFTY_IT?.change?.toFixed(2) || 0}%
                            </span>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error fetching market overview:', error);
            }
        }

        // Fetch top stocks
        async function fetchTopStocks() {
            try {
                const response = await fetch('/api/top-stocks');
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                
                const grid = document.getElementById('top-stocks-grid');
                grid.innerHTML = '';
                
                data.stocks.forEach(stock => {
                    const score = stock.composite_score || 0;
                    const scoreClass = score >= 70 ? 'score-high' : score >= 50 ? 'score-medium' : 'score-low';
                    const recClass = `rec-${stock.recommendation?.toLowerCase()?.replace('_', '-') || 'hold'}`;
                    
                    grid.innerHTML += `
                        <div class="stock-card" onclick="showStockDetails('${stock.symbol}')">
                            <div class="stock-header">
                                <div>
                                    <div class="stock-symbol">${stock.symbol}</div>
                                    <div class="stock-name">${stock.company_name || stock.symbol}</div>
                                </div>
                                <div class="score-badge ${scoreClass}">${score.toFixed(1)}</div>
                            </div>
                            <div class="stock-details">
                                <div class="detail-item">
                                    <span class="detail-label">Current Price:</span>
                                    <span class="detail-value">₹${stock.current_price?.toFixed(2) || 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Change:</span>
                                    <span class="detail-value" style="color: ${stock.price_change >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                        ${stock.price_change >= 0 ? '+' : ''}${stock.price_change?.toFixed(2) || 0}%
                                    </span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Technical:</span>
                                    <span class="detail-value">${stock.tech_score?.toFixed(1) || 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">ML:</span>
                                    <span class="detail-value">${stock.ml_prediction || 'N/A'} (${stock.ml_confidence || 0}%)</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">News:</span>
                                    <span class="detail-value">${stock.news_sentiment?.toFixed(1) || 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Articles:</span>
                                    <span class="detail-value">${stock.articles?.length || 0}</span>
                                </div>
                            </div>
                            <div class="recommendation ${recClass}">
                                ${stock.recommendation?.replace('_', ' ') || 'HOLD'}
                            </div>
                            <button class="btn-comprehensive" onclick="event.stopPropagation(); window.location.href='/stock/${stock.symbol}'">
                                <i class="fas fa-chart-line"></i> Comprehensive Analysis
                            </button>
                        </div>
                    `;
                });
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                console.error('Error fetching top stocks:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error: ' + error.message;
            }
        }

        // Search stock - now redirects to full comprehensive analysis page
        async function searchStock() {
            const symbol = document.getElementById('search-input').value.trim();
            if (!symbol) {
                alert('Please enter a stock symbol');
                return;
            }
            
            // Redirect directly to the comprehensive stock detail page
            window.location.href = '/stock/' + symbol;
        }

        // Refresh analysis
        async function refreshAnalysis() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                
                await fetch('/api/refresh-analysis');
                await fetchTopStocks();
            } catch (error) {
                console.error('Error refreshing analysis:', error);
            }
        }

        // Show stock details
        function showStockDetails(symbol) {
            window.location.href = '/stock/' + symbol;
        }

        // Handle Enter key in search
        document.getElementById('search-input')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchStock();
        });

        // Load data
        document.addEventListener('DOMContentLoaded', () => {
            fetchMarketOverview();
            fetchTopStocks();
        });
    </script>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="active" title="Home - Top Stocks"><i class="fas fa-home"></i> Home</a>
        <a href="/research" title="Research All Stocks"><i class="fas fa-search"></i> Research</a>
        <a href="/backtest" title="Backtest Strategies"><i class="fas fa-flask"></i> Backtest</a>
        <a href="/portfolio" title="Portfolio Tracking"><i class="fas fa-briefcase"></i> Portfolio</a>
        <a href="/market-overview" title="Market Overview"><i class="fas fa-chart-pie"></i> Market</a>
    </div>
</body>
</html>
